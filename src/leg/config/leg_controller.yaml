# joint_trajectory_controller 配置（类型在 launch 里用 --controller-type 指定）
joint_trajectory_controller:
  ros__parameters:
    joints:
      - front_left_leg_joint
      - front_right_leg_joint
      - rear_left_leg_joint
      - rear_right_leg_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    # 可选：不写则用默认值
    # allow_partial_joints_goal: false
    # open_loop_control: false
