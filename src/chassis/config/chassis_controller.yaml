# mecanum_drive_controller 配置（类型在 launch 里用 --controller-type 指定）
mecanum_drive_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: front_left_wheel_joint
    front_right_wheel_command_joint_name: front_right_wheel_joint
    rear_left_wheel_command_joint_name: rear_left_wheel_joint
    rear_right_wheel_command_joint_name: rear_right_wheel_joint

    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
    use_stamped_vel: false   # true 订阅 TwistStamped，false 订阅 Twist

    kinematics:
      wheels_radius: 0.05
      # = lx + ly（轮心到车体中心在 X/Y 轴投影之和），与 URDF 一致
      sum_of_robot_center_projection_on_X_Y_axis: 0.35
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0

    # 可选：速度限制、协方差、超时等（不写则用默认值）
    # reference_timeout: 2.0
    # linear.x.max_velocity: 1.0
    # linear.y.max_velocity: 1.0
    # angular.z.max_velocity: 3.0
